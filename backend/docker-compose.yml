# Localmente: docker compose up --build (usa o Dockerfile)
# Na EC2: o GitHub Actions define API_IMAGE com a imagem publicada no GHCR e roda "pull" + "up --no-build"
services:
  api:
    image: ${API_IMAGE:-prova-final-agil-api:local}
    build: .
    container_name: prova-final-agil-api
    restart: unless-stopped
    ports:
      - "8080:8080"
    environment:
      DB_HOST: postgres
      DB_PORT: 5432
      DB_NAME: provafinalagil
      DB_USER: provafinalagil_user
      DB_PASSWORD: ${DB_PASSWORD:?Defina DB_PASSWORD}
      AUTH0_DOMAIN: ${AUTH0_DOMAIN:?Defina AUTH0_DOMAIN}
      AUTH0_AUDIENCE: ${AUTH0_AUDIENCE:-https://prova-final-agil}
      AUTH0_CLAIMS_NAMESPACE: ${AUTH0_CLAIMS_NAMESPACE:-https://prova-final-agil}
      CORS_ALLOWED_ORIGINS: ${CORS_ALLOWED_ORIGINS:-http://localhost:5173}
    mem_limit: 640m
    depends_on:
      postgres:
        condition: service_healthy

  postgres:
    image: postgres:16-alpine
    container_name: prova-final-agil-postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: provafinalagil
      POSTGRES_USER: provafinalagil_user
      POSTGRES_PASSWORD: ${DB_PASSWORD:?Defina DB_PASSWORD}
    volumes:
      - prova-final-agil-postgres-data:/var/lib/postgresql/data
    mem_limit: 256m
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U provafinalagil_user -d provafinalagil"]
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  prova-final-agil-postgres-data:
